  <rect x="112" y="82" width="31" height="48" rx="14" fill="url(#hp-dark)"/>
  <rect x="112.75" y="82.75" width="29.5" height="46.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.5"/>
  <rect x="42" y="88" width="10" height="36" rx="5" fill="url(#hp-pink)"/>
  <rect x="108" y="88" width="10" height="36" rx="5" fill="url(#hp-pink)"/>
